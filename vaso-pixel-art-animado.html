  var cv=document.getElementById('art'),ctx=cv.getContext('2d');
  var img=new Image();
  img.onload=start; img.src=SRC;
  function mk(){var c=document.createElement('canvas');c.width=W;c.height=H;return c}
  function start(){
    ctx.drawImage(img,0,0,W,H);
    var d=ctx.getImageData(0,0,W,H),px=d.data;
    var red=mk(),win=mk(),rc=red.getContext('2d'),wc=win.getContext('2d');
    var rd=rc.createImageData(W,H),wd=wc.createImageData(W,H);
    var spots=[];
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      var i=(y*W+x)*4,r=px[i],g=px[i+1],b=px[i+2];
      if(r>170&&g<95&&b<130){rd.data[i]=r;rd.data[i+1]=g;rd.data[i+2]=b;rd.data[i+3]=255;if(y<250)spots.push([x,y]);}
      if(x>W*0.86&&y<H*0.66&&r>150&&b>100){wd.data[i]=r;wd.data[i+1]=g;wd.data[i+2]=b;wd.data[i+3]=255;}
    }
    rc.putImageData(rd,0,0);wc.putImageData(wd,0,0);

    var rnd=Math.random;
    var petals=[],sparks=[],dust=[];
    var pc=['#e0526f','#f27a93','#c93a5a','#ff9bb0'];
    function petal(init){return{x:rnd()*W,y:init?rnd()*H:-6,s:.25+rnd()*.35,p:rnd()*6,a:.4+rnd()*.5,c:pc[(rnd()*4)|0],w:2+((rnd()*2)|0)}}
    for(var k=0;k<16;k++)petals.push(petal(true));
    for(k=0;k<26;k++)dust.push({x:rnd()*W,y:rnd()*H,s:.05+rnd()*.12,p:rnd()*6});
    function spark(){var s=spots[(rnd()*spots.length)|0];return{x:s[0],y:s[1],t:0,l:700+rnd()*900,big:rnd()<.35}}
    for(k=0;k<14;k++){var s=spark();s.t=rnd()*s.l;sparks.push(s)}

    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    var last=0,STEP=1000/15;

    function frame(now){
      if(now-last<STEP){if(!reduce)requestAnimationFrame(frame);return}
      var dt=now-last;last=now;
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
      ctx.drawImage(img,0,0,W,H);
      // brilho pulsante dos lírios e do vitral
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=.10+.10*(.5+.5*Math.sin(now/700));
      ctx.drawImage(red,0,0);
      ctx.globalAlpha=.08+.14*(.5+.5*Math.sin(now/1300+1.5));
      ctx.drawImage(win,0,0);
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      // poeira de luz
      for(var i=0;i<dust.length;i++){var u=dust[i];
        u.y-=u.s;u.x+=Math.sin(now/1800+u.p)*.12;if(u.y<-2){u.y=H+2;u.x=rnd()*W}

        ctx.fillRect(Math.round(u.x),Math.round(u.y),1,1)}
      // brilhos
      for(i=0;i<sparks.length;i++){var p=sparks[i];p.t+=dt;if(p.t>p.l){sparks[i]=spark();continue}
        var f=Math.sin(Math.PI*p.t/p.l);if(f<.2)continue;

        ctx.fillRect(p.x,p.y,1,1);
        if(f>.5){ctx.fillRect(p.x-1,p.y,1,1);ctx.fillRect(p.x+1,p.y,1,1);ctx.fillRect(p.x,p.y-1,1,1);ctx.fillRect(p.x,p.y+1,1,1);
          if(p.big&&f>.8){ctx.fillRect(p.x-2,p.y,1,1);ctx.fillRect(p.x+2,p.y,1,1);ctx.fillRect(p.x,p.y-2,1,1);ctx.fillRect(p.x,p.y+2,1,1)}}}
      // pétalas caindo
      for(i=0;i<petals.length;i++){var q=petals[i];
        q.y+=q.s;q.x+=Math.sin(now/900+q.p)*.35;
        if(q.y>H+4)petals[i]=petal(false);
        ctx.globalAlpha=q.a;ctx.fillStyle=q.c;
        var qx=Math.round(q.x),qy=Math.round(q.y),flip=Math.sin(now/500+q.p)>0;
        ctx.fillRect(qx,qy,q.w,2);
        ctx.fillRect(flip?qx+1:qx-1,qy+1,q.w,1);
        ctx.fillStyle='#ffc2cf';ctx.fillRect(qx,qy,1,1);ctx.globalAlpha=1}
      if(!reduce)requestAnimationFrame(frame);
